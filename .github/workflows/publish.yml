name: Build and Publish Quarto Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: quarto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render website
        run: quarto render

      - name: Disable Jekyll processing
        run: touch _site/.nojekyll

      - name: Store rendered website
        uses: actions/upload-artifact@v4
        with:
          name: quarto-site-${{ github.sha }}
          path: _site
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download rendered website
        uses: actions/download-artifact@v4
        with:
          name: quarto-site-${{ github.sha }}
          path: _site

      - name: Publish website to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
